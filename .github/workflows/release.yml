name: Validate and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm.cmd test
      - run: npm.cmd run verify
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package only committed public files
        shell: pwsh
        run: |
          $version=$env:GITHUB_REF_NAME.TrimStart('v')
          $zip="t3code-quota-zh-$version-windows.zip"
          git archive --format=zip --prefix=t3code-quota-zh/ -o $zip HEAD
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $hash=(Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=$env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME "t3code-quota-zh-$version-windows.zip" SHA256SUMS.txt --verify-tag --title "v$version · 精简额度栏与中文上下文" --notes-file RELEASE_NOTES.md
