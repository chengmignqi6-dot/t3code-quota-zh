<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="400" viewBox="0 0 1560 400" role="img" aria-label="底栏状态行放大"><title>底栏状态行放大</title><desc>底栏四个区域：上下文入口、轮次与工具、词元与缓存、额度入口。</desc><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b0b0c" flood-opacity="0.13"/></filter></defs><rect x="0" y="0" width="1560" height="400" fill="#ffffff"/><g filter="url(#sh)"><rect x="40" y="26" width="1480" height="150" rx="14" fill="#ffffff" stroke="#ececee" stroke-width="1"/></g><line x1="40" y1="116" x2="1520" y2="116" stroke="#ededef" stroke-width="1" stroke-linecap="butt"/><g transform="translate(64 166) scale(1.5)"><text x="0" y="0" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#71717b" text-anchor="start">上下文</text><rect x="48" y="-8" width="52" height="8" rx="4" fill="#e9e9eb"/><path d="M52,-8h15a4,4 0 0 1 4,4v0a4,4 0 0 1 -4,4h-15a4,4 0 0 1 -4,-4v0a4,4 0 0 1 4,-4z" fill="#2b7fff"/><path d="M72.5,-8h0a1.5,1.5 0 0 1 1.5,1.5v5a1.5,1.5 0 0 1 -1.5,1.5h0a1.5,1.5 0 0 1 -1.5,-1.5v-5a1.5,1.5 0 0 1 1.5,-1.5z" fill="#fe9a00"/><text x="108" y="0" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#18181b" text-anchor="start">476k/1m</text><text x="168" y="0" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#71717b" text-anchor="start">45%</text><circle cx="203" cy="-4" r="2.1" fill="#a1a1aa"/><text x="213" y="0" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#71717b" text-anchor="start">10轮 · 工具114次 · 155词元/秒</text><line x1="414" y1="-11" x2="414" y2="5" stroke="#e4e4e7" stroke-width="1" stroke-linecap="butt"/><text x="428" y="0" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#71717b" text-anchor="start">476.3K词元 · 命中95%</text><g transform="translate(600 -13) scale(0.8)" fill="none" stroke="#71717b" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.3l3.4 2"/></g><text x="620" y="0" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#18181b" text-anchor="start">周额度</text><text x="703" y="0" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#18181b" text-anchor="end">94%</text></g><g><circle cx="75" cy="258" r="11" fill="#0b0b0c"/><text x="75" y="262.2" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g><text x="94" y="262" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#18181b" text-anchor="start">上下文入口</text><text x="182" y="262" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#71717b" text-anchor="start">点击展开上下文面板：已用 / 已缓存 / 未缓存 / 剩余空间 / 缓存命中</text><g><circle cx="75" cy="288" r="11" fill="#0b0b0c"/><text x="75" y="292.2" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g><text x="94" y="292" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#18181b" text-anchor="start">轮次与工具</text><text x="182" y="292" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#71717b" text-anchor="start">本轮统计：轮数、工具调用次数、输出速度（词元/秒）</text><g><circle cx="823" cy="318" r="11" fill="#0b0b0c"/><text x="823" y="322.2" font-family="'Segoe UI','Microsoft YaHei UI'