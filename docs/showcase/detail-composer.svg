="11" fill="#0b0b0c"/><text x="771" y="470.2" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g><text x="790" y="470" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#18181b" text-anchor="start">词元与缓存</text><text x="790" y="489" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#71717b" text-anchor="start">会话累计词元与缓存命中率，与轮次统计用竖线分隔。</text><g><circle cx="771" cy="552" r="11" fill="#0b0b0c"/><text x="771" y="556.2" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g><text x="790" y="556" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#18181b" text-anchor="start">5 小时 / 周额度</text><text x="790" y="575" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#71717b" text-anchor="start">两个窗口各一个入口；点开额度面板可看分段条与重置时间。</text><text x="40" y="704" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#a1a1aa" text-anchor="start">示意数据；实际数值随会话变化，缺失时不补造。</text></svg>
